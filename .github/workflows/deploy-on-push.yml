name: Deploy site on push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'machine-learning-module/results/STGNN/**'
      - 'dengue-infection-module/results/**'
      - 'site/**'
      - 'docs/**'

jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter ipykernel nbclient pyyaml pandas numpy plotly pyarrow
          # Write QUARTO_PYTHON into the persistent env so every subsequent
          # step (including quarto-actions/setup) sees the correct interpreter.
          echo "QUARTO_PYTHON=$pythonLocation/bin/python3" >> $GITHUB_ENV

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Register kernel and check Quarto Python detection
        run: |
          python -m ipykernel install --sys-prefix --name python3 --display-name "Python 3"
          echo "=== kernel location ==="
          python -m jupyter kernelspec list
          echo "=== quarto check ==="
          quarto check jupyter 2>&1 || true

      - name: Render site
        working-directory: site
        run: quarto render .

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "chore: deploy on push ${{ github.sha }}"
