name: Monthly site update

on:
  schedule:
    # 02:00 UTC on the 1st of each month
    - cron: '0 2 1 * *'
  # Allow manual trigger from the Actions tab (useful for testing)
  workflow_dispatch:
    inputs:
      month:
        description: 'Target month (YYYY-MM). Leave blank to use default (2 months ago).'
        required: false
        default: ''

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed by peaceiris/actions-gh-pages to push docs/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python environment ────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # torch must be installed first with its own index; --index-url is
          # a global pip flag that would poison the index for all other packages
          # if mixed into a single pip install call.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install \
            jupyter \
            ipykernel \
            pyyaml \
            earthengine-api \
            geopandas \
            pandas \
            numpy \
            torch-geometric \
            plotly \
            pyarrow

      # ── Step 1: Fetch zonal statistics from GEE ──────────────────────────
      - name: Fetch monthly zonal statistics
        env:
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
        run: |
          MONTH_ARG=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            MONTH_ARG="--month ${{ github.event.inputs.month }}"
          fi
          python site/scripts/fetch_zonal_stats.py $MONTH_ARG

      # ── Step 2: Apply climate delta bias correction ───────────────────────
      - name: Apply climate delta correction
        run: python site/scripts/apply_climate_delta.py

      # ── Step 3: Run STGNN inference (CPU) ────────────────────────────────
      - name: Run STGNN inference
        run: python site/scripts/run_inference.py

      # ── Step 4: Commit monthly prediction archive to main ────────────────
      # This persists the per-month file permanently in the repo.
      # [skip ci] prevents deploy-on-push.yml from firing on this commit.
      - name: Commit prediction archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/predictions/ site/data/latest_predictions.json site/data/climate_deltas.json
          git diff --cached --quiet || git commit -m "data: predictions for $(cat site/data/latest_predictions.json | python -c 'import sys,json; print(json.load(sys.stdin)[\"target_month\"])') [skip ci]"
          git push origin main

      # ── Step 5: Render Quarto site ────────────────────────────────────────
      # Quarto may resolve python3 through its own detection rather than PATH.
      # Symlinking ensures /usr/bin/python3 (a common hardcoded fallback) always
      # points to the toolcache Python that has all packages installed.
      - name: Point system python3 to toolcache Python
        run: sudo ln -sf "$pythonLocation/bin/python3" /usr/bin/python3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Register Jupyter kernel
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Debug Python / Quarto detection
        run: |
          echo "=== which python3 ==="
          which python3
          python3 --version
          echo "=== pyyaml check ==="
          python3 -c "import yaml; print('yaml', yaml.__version__)" || echo "MISSING yaml"
          echo "=== jupyter check ==="
          python3 -m jupyter --version || echo "MISSING jupyter"
          echo "=== kernelspec list ==="
          python3 -m jupyter kernelspec list
          echo "=== quarto check jupyter ==="
          quarto check jupyter || true

      - name: Render site
        run: QUARTO_PYTHON="$pythonLocation/bin/python3" quarto render site/

      # ── Step 5: Deploy to GitHub Pages ────────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          # Keeps gh-pages history lean — one commit per month
          force_orphan: false
          commit_message: "chore: monthly site update ${{ github.run_id }}"
