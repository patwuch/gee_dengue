# ============================================================
# OpenDengue SEA — STGNN Regressor (IR only, no env features)
#
# Uses only past incidence (IR) as input — no climate, no LULC,
# no quality flags. Acts as a purely temporal autoregressive
# baseline to quantify how much the env features contribute
# over and above the signal already in lagged IR.
#
# Invoke: snakemake results/STGNN/{name}/metrics.json \
#             --configfile config/OpenDengue/stgnn_IR_only.yaml \
#             --cores 4 --resources gpu=1
# ============================================================

name:    logIR_only
dataset: opendengue
model:   stgnn
task:    regressor
scope:   multi-country
wandb_project: stgnn-dengue

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  path:          data/interim/machine-learning/SEA_dengue_env_monthly_2011-2018.csv
  time_column:   year_month
  unit_column:   adm_1_name
  region_column: adm_0_name
  split:
    strategy:     month
    test_months:  14
    val_fraction: 0.2

# ---------------------------------------------------------------------------
# Target
# ---------------------------------------------------------------------------
target_column: IR

# ---------------------------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------------------------
preprocessing:
  log_transform:  true
  deseasonalise:  false
  scale_target:   true
  cyclical_month_features: true
  add_lag_target: false
  lag_steps:      []

# ---------------------------------------------------------------------------
# Features — env and LULC empty; quality dropped to keep this truly IR-only
# ---------------------------------------------------------------------------
features:
  use_landuse:   false
  quality_vars:  ['data_quality']
  env_vars:      []
  climate_vars:  []
  epidemic_vars: []
  land_use_vars: []

# ---------------------------------------------------------------------------
# Tuning
# ---------------------------------------------------------------------------
tune:
  n_trials:     40
  metric:       masked_huber_loss
  device:       cuda
  num_epochs:   50
  patience:     15
  search_space:
    stgnn:
      learning_rate:   {type: log_uniform, low: 1.0e-4, high: 5.0e-1}
      batch_size:      {type: categorical, choices: [2, 4]}
      window_size:     {type: categorical, choices: [1, 3, 6, 12]}
      gat1_hidden:     {type: categorical, choices: [16, 32, 64]}
      gat1_heads:      {type: categorical, choices: [2, 4]}
      mlp_hidden:      {type: categorical, choices: [32, 64]}
      gat2_hidden:     {type: categorical, choices: [16, 32, 64]}
      gat2_heads:      {type: categorical, choices: [2, 4]}
      mlp_layers:      {type: categorical, choices: [1, 2]}
      dropout:         {type: categorical, choices: [0.0, 0.2, 0.4]}
