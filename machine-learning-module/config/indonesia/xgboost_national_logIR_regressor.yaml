# ============================================================
# Indonesia — XGBoost National Regressor
# Invoke: snakemake <target> --configfile config/IND_xgboost_national_regressor.yaml
# ============================================================

name:    national-regressor-kfold-nolulc
dataset: indonesia
model:   xgboost
task:    regressor
scope:   national

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  path:          data/processed/INDONESIA/monthly_dengue_env_id_updated.csv
  time_column:   YearMonth
  unit_column:   ID_2
  region_column: Region_Group
  split:
    strategy:  random
    test_size: 0.2

# ---------------------------------------------------------------------------
# Target
# ---------------------------------------------------------------------------
target:
  column: Incidence_Rate

# ---------------------------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------------------------
preprocessing:
  log_transform:  false
  add_lag_target: false
  lag_steps:      [1, 2, 3]

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
features:
  use_landuse: false
  env_vars:
    - temperature_2m
    - temperature_2m_min
    - temperature_2m_max
    - precipitation
    - potential_evaporation_sum
    - total_evaporation_sum
    - evaporative_stress_index
    - aridity_index
    - temperature_2m_ANOM
    - temperature_2m_min_ANOM
    - temperature_2m_max_ANOM
    - potential_evaporation_sum_ANOM
    - total_evaporation_sum_ANOM
    - precipitation_ANOM
  climate_vars:
    - ANOM1+2
    - ANOM3
    - ANOM4
    - ANOM3.4
    - DMI
    - DMI_East
  epidemic_vars: []
  land_use_vars:
    - Class_70
    - Class_60
    - Class_50
    - Class_40
    - Class_95
    - Class_30
    - Class_20
    - Class_10
    - Class_90
    - Class_80

# ---------------------------------------------------------------------------
# Validation (CV strategy for tuning)
# ---------------------------------------------------------------------------
validation:
  strategy:         kfold
  kfold_n_splits:   5
  walk_test_window: 12
  walk_init_window: 36

# ---------------------------------------------------------------------------
# Tuning
# ---------------------------------------------------------------------------
tune:
  n_trials:     50
  random_state: 64
  device:       cuda
  search_space:
    xgboost:
      learning_rate:    {type: log_uniform, low: 1.0e-4, high: 0.1}
      max_depth:        {type: int,         low: 2,      high: 10}
      n_estimators:     {type: int,         low: 50,     high: 1000}
      subsample:        {type: float,       low: 0.5,    high: 1.0}
      colsample_bytree: {type: float,       low: 0.5,    high: 1.0}
      min_child_weight: {type: int,         low: 5,      high: 50}
      gamma:            {type: log_uniform, low: 1.0e-2, high: 10.0}
      reg_alpha:        {type: log_uniform, low: 1.0e-2, high: 10.0}
      reg_lambda:       {type: log_uniform, low: 0.1,    high: 100.0}
