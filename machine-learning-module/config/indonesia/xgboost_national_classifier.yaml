# ============================================================
# Indonesia — XGBoost National Classifier
# ------------------------------------------------------------
# Replaces the legacy 6-character config string, e.g. "WT1014":
#   position 0 : W/K  → validation.strategy
#   position 1 : T/F  → features.use_landuse
#   positions 2-5 : date stamp → experiment.name (use a meaningful label instead)
# ============================================================

experiment:
  name: national-classifier-walk-lulc   # unique label; used for output filenames
                                         # (replaces the date-stamp portion of the old code)

dataset: indonesia
scope: national     # 'national' | 'regional'  (this file = national)
task:   classifier  # 'classifier' | 'regressor'

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  processed_file: "INDONESIA/monthly_dengue_env_id_class_log.csv"   # relative to data/processed/
  time_column:   YearMonth
  unit_column:   ID_2
  region_column: Region_Group
  test_year:     2023   # rows where YearMonth.year == test_year held out as final test

# ---------------------------------------------------------------------------
# Target
# ---------------------------------------------------------------------------
target:
  column: Risk_Category
  labels:                 # string → int encoding applied before training
    Zero: 0
    Low:  1
    High: 2

# ---------------------------------------------------------------------------
# Features  (replaces T/F flag at position 1 of the old config string)
# ---------------------------------------------------------------------------
features:
  env_vars:
    - temperature_2m
    - temperature_2m_min
    - temperature_2m_max
    - precipitation
    - potential_evaporation_sum
    - total_evaporation_sum
    - evaporative_stress_index
    - aridity_index
    - temperature_2m_ANOM
    - temperature_2m_min_ANOM
    - temperature_2m_max_ANOM
    - potential_evaporation_sum_ANOM
    - total_evaporation_sum_ANOM
    - precipitation_ANOM

  climate_vars:
    - ANOM1+2
    - ANOM3
    - ANOM4
    - ANOM3.4
    - DMI
    - DMI_East

  epidemic_vars:          # lag-1 incidence rate added as a feature
    - Incidence_Rate_lag1

  land_use_vars:
    - Class_70
    - Class_60
    - Class_50
    - Class_40
    - Class_95
    - Class_30
    - Class_20
    - Class_10
    - Class_90
    - Class_80

  use_landuse: true       # replaces T/F flag at position 1 of the old config string
  lag_steps: [1, 2, 3]   # applied to env_vars and climate_vars

# ---------------------------------------------------------------------------
# Validation  (replaces W/K flag at position 0 of the old config string)
# ---------------------------------------------------------------------------
validation:
  strategy: walk          # 'walk' | 'kfold'
  walk_test_window: 12    # months per validation fold (walk-forward only)
  walk_init_window: 36    # minimum months before first validation fold
  kfold_n_splits:   5     # used when strategy = kfold

# ---------------------------------------------------------------------------
# Training & tuning
# ---------------------------------------------------------------------------
training:
  n_trials:     40
  random_state: 64
  device:       cuda      # 'cuda' | 'cpu'
