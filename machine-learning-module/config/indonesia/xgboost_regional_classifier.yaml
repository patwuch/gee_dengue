# ============================================================
# Indonesia — XGBoost Regional Classifier
# ------------------------------------------------------------
# Same structure as xgboost_national_classifier.yaml but
# scope = regional, so tune/train/eval loops over each Region_Group.
# ============================================================

experiment:
  name: regional-classifier-walk-lulc

dataset: indonesia
scope: regional     # 'national' | 'regional'
task:   classifier

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  processed_file: "INDONESIA/monthly_dengue_env_id_class_log.csv"
  time_column:   YearMonth
  unit_column:   ID_2
  region_column: Region_Group
  test_year:     2023

# ---------------------------------------------------------------------------
# Target
# ---------------------------------------------------------------------------
target:
  column: Risk_Category
  labels:
    Zero: 0
    Low:  1
    High: 2

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
features:
  env_vars:
    - temperature_2m
    - temperature_2m_min
    - temperature_2m_max
    - precipitation
    - potential_evaporation_sum
    - total_evaporation_sum
    - evaporative_stress_index
    - aridity_index
    - temperature_2m_ANOM
    - temperature_2m_min_ANOM
    - temperature_2m_max_ANOM
    - potential_evaporation_sum_ANOM
    - total_evaporation_sum_ANOM
    - precipitation_ANOM

  climate_vars:
    - ANOM1+2
    - ANOM3
    - ANOM4
    - ANOM3.4
    - DMI
    - DMI_East

  epidemic_vars:
    - Incidence_Rate_lag1

  land_use_vars:
    - Class_70
    - Class_60
    - Class_50
    - Class_40
    - Class_95
    - Class_30
    - Class_20
    - Class_10
    - Class_90
    - Class_80

  use_landuse: true
  lag_steps: [1, 2, 3]

# ---------------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------------
validation:
  strategy: walk
  walk_test_window: 12
  walk_init_window: 36
  kfold_n_splits:   5

# ---------------------------------------------------------------------------
# Training & tuning
# ---------------------------------------------------------------------------
training:
  n_trials:     40
  random_state: 64
  device:       cuda
